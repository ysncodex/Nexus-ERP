# Render Blueprint for the Cafe ERP backend (Express + Prisma + PostgreSQL).
# Place this at the repository root that you deploy on Render.
#
# If you push ONLY the backend folder as its own repo, this file (at the repo
# root) works as-is. If you push the whole monorepo, add `rootDir: cafe-backend`
# under the service and deploy from the repo root instead.
#
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: cafe-erp-backend
    runtime: node
    plan: free
    # Installs deps (runs `postinstall` → prisma generate) then applies migrations.
    buildCommand: npm install && npm run db:deploy
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # DATABASE_URL — set in the Render dashboard (Neon/hosted Postgres, sslmode=require).
      - key: DATABASE_URL
        sync: false
      # JWT_SECRET — a strong random secret generated by Render on first deploy.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # CORS_ORIGIN — set to your Netlify site URL, e.g. https://your-site.netlify.app
      # Multiple origins allowed, comma-separated.
      - key: CORS_ORIGIN
        sync: false
